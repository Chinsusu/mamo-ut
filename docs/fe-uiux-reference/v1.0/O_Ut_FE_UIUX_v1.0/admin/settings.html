    <div class="admin-content"><div class="admin-page-header"><div><h1>Cấu hình cửa hàng</h1><p>Nhóm theo Store, Shipping, Payment và Contact.</p></div></div><form data-settings-form><div class="admin-form-layout"><div><div class="admin-form-card"><div class="admin-form-card__header"><h2>Thông tin cửa hàng</h2></div><div class="admin-form-card__body"><div class="admin-form-grid"><div class="admin-field"><label>Tên cửa hàng</label><input class="admin-control" name="storeName"></div><div class="admin-field"><label>Hotline</label><input class="admin-control" name="hotline"></div><div class="admin-field"><label>Email</label><input class="admin-control" name="email"></div><div class="admin-field admin-field--full"><label>Địa chỉ</label><input class="admin-control" name="address"></div></div></div></div><div class="admin-form-card"><div class="admin-form-card__header"><h2>Giao hàng</h2></div><div class="admin-form-card__body"><div class="admin-form-grid"><div class="admin-field"><label>Phí giao tiêu chuẩn</label><input class="admin-control" name="shippingStandard" type="number"></div><div class="admin-field"><label>Phí giao nhanh</label><input class="admin-control" name="shippingExpress" type="number"></div><div class="admin-field"><label>Ngưỡng miễn phí giao</label><input class="admin-control" name="freeShippingThreshold" type="number"></div></div></div></div><div class="admin-form-card"><div class="admin-form-card__header"><h2>Thanh toán chuyển khoản</h2></div><div class="admin-form-card__body"><div class="admin-form-grid"><div class="admin-field"><label>Ngân hàng</label><input class="admin-control" name="bankName"></div><div class="admin-field"><label>Số tài khoản</label><input class="admin-control" name="bankAccount"></div><div class="admin-field admin-field--full"><label>Chủ tài khoản</label><input class="admin-control" name="bankOwner"></div></div></div></div></div><aside><div class="admin-form-card"><div class="admin-form-card__header"><h2>Mạng xã hội</h2></div><div class="admin-form-card__body"><div class="admin-field"><label>Facebook</label><input class="admin-control" name="facebook"></div><div class="admin-field" style="margin-top:12px"><label>Instagram</label><input class="admin-control" name="instagram"></div><div class="admin-field" style="margin-top:12px"><label>Zalo</label><input class="admin-control" name="zalo"></div></div></div><div class="admin-form-card"><div class="admin-form-card__body"><p class="small muted">Các trường này là nguồn dữ liệu cho header, footer, checkout và trang liên hệ trong backend thật.</p></div></div></aside></div><div class="sticky-actions"><span class="small muted">Không autosave để tránh thay đổi nhầm cấu hình quan trọng.</span><button class="btn btn--primary" type="submit"><svg class="icon"><use href="../assets/icons/icons.svg#save"></use></svg> Lưu cấu hình</button></div></form></div>
